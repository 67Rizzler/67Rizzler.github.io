<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Review Lab Session</title>
<style>
body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
.nav-btn { background: #444; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
.nav-btn:hover { background: #666; }
.game-container { margin: 20px auto; max-width: 800px; background: #222; padding: 20px; border-radius: 8px; border: 2px solid #333; }
iframe { width: 100%; height: 600px; border: none; background: #000; border-radius: 4px; display: none; }
iframe.active { display: block; }
select { background: #333; color: white; padding: 10px; border-radius: 5px; font-size: 16px; margin: 20px; border: 1px solid #555; cursor: pointer; }
</style>
</head>
<body>
<br><br>
<a href="index.html" class="nav-btn">← Back to Study Guide</a>
<h1>Practice Lab & Simulations</h1>
<p>Select a data simulation module from the dropdown below to verify your parameters.</p>

<!-- Dropdown Menu to choose games -->
<select id="gameSelector" onchange="switchGame()">
<option value="game1">Simulation Module 4.3A (Snake)</option>
<option value="game2">Simulation Module 4.3B (Retro Basket)</option>
<option value="game3">Simulation Module 4.3C (Drive Lab)</option>
</select>

<div class="game-container">
<!-- Game 1: Snake -->
<iframe id="game1" class="active" src="https://playclassic.games" allowfullscreen></iframe>

<!-- Game 2: Basket Random style proxy clone -->
<iframe id="game2" src="https://googleusercontent.com" allowfullscreen></iframe>

<!-- Game 3: Moto X3M / Drive style proxy clone -->
<iframe id="game3" src="https://googleusercontent.com" allowfullscreen></iframe>
</div>

<script>
function switchGame() {
var selectedGame = document.getElementById("gameSelector").value;
var iframes = document.querySelectorAll(".game-container iframe");

// Hide all games
iframes.forEach(function(iframe) {
iframe.classList.remove("active");
});

// Show the selected game
document.getElementById(selectedGame).classList.add("active");
}
</script>
</body>
</html>
